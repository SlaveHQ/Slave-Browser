<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BrowserOS</title>

        <meta name="manifest.open_in_tab" content="true" />
        <script>
            (function() {
                var store = new Map();
                var createStorageArea = function() {
                    return {
                        get: function(keys, cb) {
                            var res = {};
                            var keyList = typeof keys === 'string' ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
                            for (var i = 0; i < keyList.length; i++) {
                                var k = keyList[i];
                                if (store.has(k)) res[k] = store.get(k);
                            }
                            if (cb) cb(res);
                            return Promise.resolve(res);
                        },
                        set: function(items, cb) {
                            for (var k in items) { store.set(k, items[k]); }
                            if (cb) cb();
                            return Promise.resolve();
                        },
                        remove: function(keys, cb) {
                            var keyList = typeof keys === 'string' ? [keys] : Array.isArray(keys) ? keys : [];
                            for (var i = 0; i < keyList.length; i++) store.delete(keyList[i]);
                            if (cb) cb();
                            return Promise.resolve();
                        },
                        clear: function(cb) {
                            store.clear();
                            if (cb) cb();
                            return Promise.resolve();
                        },
                        getItem: function(key) { return Promise.resolve(store.has(key) ? store.get(key) : null); },
                        setItem: function(key, val) { store.set(key, val); return Promise.resolve(); },
                        removeItem: function(key) { store.delete(key); return Promise.resolve(); },
                        onChanged: { addListener: function(){}, removeListener: function(){} }
                    };
                };
                var mockStorage = {
                    local: createStorageArea(),
                    sync: createStorageArea(),
                    session: createStorageArea(),
                    onChanged: { addListener: function(){}, removeListener: function(){} }
                };
                var mockRuntime = {
                    id: 'browseros-agent-dev',
                    getURL: function(p) { return p; },
                    sendMessage: function() { return Promise.resolve(); },
                    onMessage: { addListener: function(){}, removeListener: function(){} }
                };
                if (typeof window !== 'undefined') {
                    if (!window.chrome) window.chrome = {};
                    if (!window.chrome.runtime) window.chrome.runtime = mockRuntime;
                    if (!window.chrome.storage) window.chrome.storage = mockStorage;

                    if (!window.browser) window.browser = {};
                    if (!window.browser.runtime) window.browser.runtime = mockRuntime;
                    if (!window.browser.storage) window.browser.storage = mockStorage;
                }
            })();
        </script>
        <script type="module">
            try {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background h-screen w-screen">
        <div id="root"></div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
