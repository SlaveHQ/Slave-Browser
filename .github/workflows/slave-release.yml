name: Slave Browser Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build Release (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Set up Swap Space
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout SlaveBrowser
        uses: actions/checkout@v4
        with:
          path: SlaveBrowser

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium (NOTE - Standard runner disk space might be insufficient)
        run: |
          mkdir chromium && cd chromium
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_pgo_profiles": False,
              },
            },
          ]
          EOF
          gclient sync --nohooks --no-history -R
          gclient runhooks

      - name: Apply SlaveBrowser overlay
        run: |
          cp -r SlaveBrowser/* chromium/src/ || true

      - name: Configure GN (Release)
        run: |
          cd chromium/src
          gn gen out/SlaveRelease --args="is_debug=false is_official_build=true is_component_build=false symbol_level=0 use_thin_lto=true use_siso=true chrome_pgo_phase=0"

      - name: Setup Siso Cache
        uses: actions/cache@v3
        with:
          path: chromium/src/out/SlaveRelease/.siso_fs_state
          key: siso-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            siso-release-${{ runner.os }}-

      - name: Build
        run: |
          cd chromium/src
          autoninja -C out/SlaveRelease chrome

      - name: Generate BUILD_INFO
        run: |
          cd chromium/src
          cat << EOF > out/SlaveRelease/BUILD_INFO
          Product: Slave Browser
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Chromium revision: $(git rev-parse HEAD)
          Build type: Release
          Build date: $(date -u)
          EOF

      - name: Package Slave Browser
        run: |
          cd chromium/src/out/SlaveRelease
          mkdir -p package
          cp chrome package/
          cp -r locales package/ 2>/dev/null || true
          cp *.pak package/ 2>/dev/null || true
          cp icudtl.dat package/ 2>/dev/null || true
          cp v8_context_snapshot.bin package/ 2>/dev/null || true
          cp BUILD_INFO package/
          tar -cJf Slave-Browser-linux-x64-${{ github.sha }}.tar.xz package/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slave-Browser-linux-x64
          path: chromium/src/out/SlaveRelease/Slave-Browser-linux-x64-*.tar.xz
