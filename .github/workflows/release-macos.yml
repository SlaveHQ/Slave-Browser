name: "Release: macOS Browser (signed, self-hosted)"

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Product set to build"
        type: choice
        default: slave agent
        options:
          - slave agent
          - browserclaw
          - all
      arch:
        description: "macOS architecture"
        type: choice
        default: universal
        options:
          - arm64
          - universal
      upload_to_r2:
        description: "Upload release metadata/artifacts to R2"
        type: boolean
        default: true
      ref:
        description: "Published-mode checkout ref"
        type: string
        default: ""
  workflow_call:
    inputs:
      products:
        description: "Product set to build: slave agent, browserclaw, or all"
        required: false
        type: string
        default: slave agent
      arch:
        description: "macOS architecture: arm64 or universal"
        required: false
        type: string
        default: universal
      upload_to_r2:
        description: "Upload release metadata/artifacts to R2"
        required: false
        type: boolean
        default: true
      resource_mode:
        description: "Resource provider: published or source"
        required: false
        type: string
        default: published
      candidate_sha:
        description: "Exact source candidate SHA"
        required: false
        type: string
        default: ""
      prepared_resources_artifact:
        description: "Prepared common-resource artifact"
        required: false
        type: string
        default: ""
      ref:
        description: "Published-mode checkout ref"
        required: false
        type: string
        default: ""
      server_version:
        description: "Exact published product server version"
        required: false
        type: string
        default: ""
      extension_version:
        description: "Exact published product extension version"
        required: false
        type: string
        default: ""
      onboarding_version:
        description: "Exact published onboarding resource version"
        required: false
        type: string
        default: ""
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET:
        required: false
      SLAVEAGENT_CONFIG_URL:
        required: false
      POSTHOG_API_KEY:
        required: false
      SENTRY_DSN:
        required: false
      CLAW_POSTHOG_KEY:
        required: false
      MACOS_CERTIFICATE_NAME:
        required: false
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PWD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      PROD_MACOS_NOTARIZATION_APPLE_ID:
        required: false
      PROD_MACOS_NOTARIZATION_TEAM_ID:
        required: false
      PROD_MACOS_NOTARIZATION_PWD:
        required: false
      PROD_MACOS_SLAVEAGENT_PASSKEY_PROFILE_B64:
        required: false
      PROD_MACOS_BROWSERCLAW_PASSKEY_PROFILE_B64:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, slave agent-builder]
    concurrency:
      group: macos-build
      cancel-in-progress: false
      queue: max
    timeout-minutes: 1200
    env:
      SLAVEAGENT_REPO: ${{ vars.SLAVEAGENT_REPO_PATH }}
      SLAVEBROWSER_SRC: ${{ vars.SLAVEAGENT_SLAVEBROWSER_SRC }}
    steps:
      - name: Resolve build inputs
        id: inputs
        env:
          ARCH: ${{ inputs.arch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREPARED_ARTIFACT: ${{ inputs.prepared_resources_artifact }}
          PRODUCTS: ${{ inputs.products }}
          REF: ${{ inputs.ref }}
          RESOURCE_MODE: ${{ inputs.resource_mode }}
          SERVER_VERSION: ${{ inputs.server_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          ONBOARDING_VERSION: ${{ inputs.onboarding_version }}
          UPLOAD_TO_R2: ${{ inputs.upload_to_r2 }}
        run: |
          set -euo pipefail
          repo="${SLAVEAGENT_REPO/#\~/$HOME}"
          slavebrowser_src="${SLAVEBROWSER_SRC/#\~/$HOME}"
          products="${PRODUCTS:-slave agent}"
          arch="${ARCH:-universal}"
          resource_mode="${RESOURCE_MODE:-published}"
          upload_to_r2="${UPLOAD_TO_R2:-true}"
          target_ref="${REF:-$DEFAULT_BRANCH}"

          if [ ! -d "$repo/.git" ]; then
            echo "::error::SLAVEAGENT_REPO_PATH does not point to a git checkout: $repo"
            exit 1
          fi
          if [ ! -d "$slavebrowser_src" ]; then
            echo "::error::SLAVEAGENT_SLAVEBROWSER_SRC does not exist: $slavebrowser_src"
            exit 1
          fi
          case "$products" in
            slave agent|browserclaw)
              product_ids="$products"
              ;;
            all)
              if [ "$resource_mode" = "source" ]; then
                echo "::error::source mode builds one candidate product per lane"
                exit 1
              fi
              product_ids="slave agent browserclaw"
              ;;
            *)
              echo "::error::products must be slave agent, browserclaw, or all"
              exit 1
              ;;
          esac
          case "$arch" in
            arm64|universal) ;;
            *)
              echo "::error::arch must be arm64 or universal"
              exit 1
              ;;
          esac
          case "$resource_mode" in
            published)
              if { [ -n "$SERVER_VERSION" ] || [ -n "$EXTENSION_VERSION" ] || [ -n "$ONBOARDING_VERSION" ]; } && \
                { [ -z "$SERVER_VERSION" ] || [ -z "$EXTENSION_VERSION" ] || [ -z "$ONBOARDING_VERSION" ]; }; then
                echo "::error::published component pins require server, extension, and onboarding versions"
                exit 1
              fi
              ;;
            source)
              if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::source mode requires a full candidate_sha"
                exit 1
              fi
              if [ -z "$PREPARED_ARTIFACT" ]; then
                echo "::error::source mode requires prepared_resources_artifact"
                exit 1
              fi
              target_ref="$CANDIDATE_SHA"
              ;;
            *)
              echo "::error::resource_mode must be published or source"
              exit 1
              ;;
          esac

          prepared_dir="$RUNNER_TEMP/prepared-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          lane_manifest="$RUNNER_TEMP/lane-$products-macos-$arch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          {
            echo "arch=$arch"
            echo "slaveagent_repo=$repo"
            echo "slavebrowser_src=$slavebrowser_src"
            echo "lane_artifact=lane-$products-macos-$arch"
            echo "lane_manifest=$lane_manifest"
            echo "prepared_dir=$prepared_dir"
            echo "product_ids=$product_ids"
            echo "products=$products"
            echo "resource_mode=$resource_mode"
            echo "target_ref=$target_ref"
            echo "upload_to_r2=$upload_to_r2"
          } >> "$GITHUB_OUTPUT"

      - name: Sync build repo to exact ref
        id: sync
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RESOURCE_MODE: ${{ steps.inputs.outputs.resource_mode }}
          TARGET_REF: ${{ steps.inputs.outputs.target_ref }}
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}
        run: |
          set -euo pipefail
          git fetch origin --tags --prune --prune-tags --force \
            '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard
          git clean -fd
          if [ "$RESOURCE_MODE" = "source" ]; then
            git cat-file -e "$CANDIDATE_SHA^{commit}"
            git checkout --detach "$CANDIDATE_SHA"
            git reset --hard "$CANDIDATE_SHA"
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          elif [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git cat-file -e "$TARGET_REF^{commit}"
            git checkout --detach "$TARGET_REF"
          elif git show-ref --verify --quiet "refs/remotes/origin/$TARGET_REF"; then
            git checkout -B "$TARGET_REF" "origin/$TARGET_REF"
            git reset --hard "origin/$TARGET_REF"
          else
            git fetch origin "$TARGET_REF"
            git checkout --detach FETCH_HEAD
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TARGET_REF^{commit}")"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Setup disposable Slave Browser workspace
        id: slavebrowser_workspace
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}
        shell: bash
        run: bash .github/scripts/macos-slave browser-workspace.sh setup "${{ steps.inputs.outputs.slavebrowser_src }}"

      - name: Setup Bun
        if: steps.inputs.outputs.resource_mode == 'source' && steps.inputs.outputs.products == 'slave agent'
        # Pinned literally rather than read from package.json: this job builds
        # from the persistent tree at SLAVEAGENT_REPO_PATH and never checks out
        # into GITHUB_WORKSPACE, which is where setup-bun resolves a version
        # file from. A workspace-relative path finds nothing and Bun silently
        # falls back to latest. Keep in sync with packageManager.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Slave Agent server dependencies
        if: steps.inputs.outputs.resource_mode == 'source' && steps.inputs.outputs.products == 'slave agent'
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent-agent
        run: bun ci

      - name: Setup Slave Agent neo server toolchain
        if: steps.inputs.outputs.resource_mode == 'source' && steps.inputs.outputs.products == 'browserclaw'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Download prepared common resources
        if: steps.inputs.outputs.resource_mode == 'source'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.prepared_resources_artifact }}
          path: ${{ steps.inputs.outputs.prepared_dir }}

      - name: Resolve browser version
        id: version
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent
        run: |
          version="$(uv run python bos_build/scripts/bump_version.py --mode none)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Remove stale selected-product DMGs
        env:
          SLAVEAGENT_REPO: ${{ steps.inputs.outputs.slaveagent_repo }}
          PRODUCT_IDS: ${{ steps.inputs.outputs.product_ids }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_dir="$SLAVEAGENT_REPO/packages/slave agent/releases/$VERSION"
          if [ ! -d "$release_dir" ]; then
            exit 0
          fi
          for product in $PRODUCT_IDS; do
            case "$product" in
              slave agent)
                find "$release_dir" -maxdepth 1 -type f \
                  -name 'SlaveAgent_*.dmg' ! -name 'SlaveAgent_neo_*.dmg' -delete
                ;;
              browserclaw)
                find "$release_dir" -maxdepth 1 -type f \
                  -name 'SlaveAgent_neo_*.dmg' -delete
                ;;
            esac
          done

      - name: Import macOS signing certificate
        id: macos_signing
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          PROD_MACOS_SLAVEAGENT_PASSKEY_PROFILE_B64: ${{ secrets.PROD_MACOS_SLAVEAGENT_PASSKEY_PROFILE_B64 }}
          PROD_MACOS_BROWSERCLAW_PASSKEY_PROFILE_B64: ${{ secrets.PROD_MACOS_BROWSERCLAW_PASSKEY_PROFILE_B64 }}
        shell: bash
        run: bash .github/scripts/macos-signing-keychain.sh setup

      - name: Build selected products
        working-directory: ${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent
        env:
          SLAVEAGENT_BUILD_SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
          SLAVEAGENT_SERVER_RESOURCE_VERSION: ${{ steps.inputs.outputs.products == 'slave agent' && inputs.server_version || '' }}
          BROWSERCLAW_SERVER_RESOURCE_VERSION: ${{ steps.inputs.outputs.products == 'browserclaw' && inputs.server_version || '' }}
          ONBOARDING_RESOURCE_VERSION: ${{ inputs.onboarding_version }}
          SLAVEAGENT_CONFIG_URL: ${{ secrets.SLAVEAGENT_CONFIG_URL }}
          BUNDLED_EXTENSIONS_MANIFEST_URL: ${{ inputs.extension_version && format('{0}/updates/extensions/bundled-manifest.xml', steps.inputs.outputs.slaveagent_repo) || '' }}
          BUNDLED_PRODUCT_EXTENSION_VERSION: ${{ inputs.extension_version }}
          CLAW_POSTHOG_KEY: ${{ secrets.CLAW_POSTHOG_KEY }}
          MACOS_CERTIFICATE_NAME: ${{ steps.macos_signing.outputs.codesign_identity }}
          MACOS_KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_SLAVEAGENT_PASSKEY_PROFILE_PATH: ${{ steps.macos_signing.outputs.slaveagent_passkey_profile_path }}
          PROD_MACOS_BROWSERCLAW_PASSKEY_PROFILE_PATH: ${{ steps.macos_signing.outputs.browserclaw_passkey_profile_path }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for product in ${{ steps.inputs.outputs.product_ids }}; do
            args=(
              --preset release
              --product "$product"
              --arch "${{ steps.inputs.outputs.arch }}"
              --resource-mode "${{ steps.inputs.outputs.resource_mode }}"
              --slave browser-src "${{ steps.slavebrowser_workspace.outputs.slavebrowser_src }}"
            )
            if [ "${{ steps.inputs.outputs.upload_to_r2 }}" != "true" ]; then
              args+=(--no-upload)
            fi
            if [ "${{ steps.inputs.outputs.resource_mode }}" = "source" ]; then
              args+=(
                --prepared-resources "${{ steps.inputs.outputs.prepared_dir }}"
                --lane-manifest "${{ steps.inputs.outputs.lane_manifest }}"
                --toolchain-id "runner=self-hosted-macos-arm64"
                --toolchain-id "workflow-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              )
            fi
            uv run slave agent build "${args[@]}"
          done

      - name: Clean up disposable Slave Browser workspace
        if: always()
        env:
          MACOS_SLAVEBROWSER_WORKSPACE_STATE_PATH: ${{ steps.slavebrowser_workspace.outputs.state_path }}
        shell: bash
        run: |
          set -euo pipefail
          script="${{ steps.inputs.outputs.slaveagent_repo }}/.github/scripts/macos-slave browser-workspace.sh"
          if [ -f "$script" ]; then
            bash "$script" cleanup
          fi

      - name: Clean up macOS signing keychain
        if: always()
        env:
          MACOS_SIGNING_STATE_PATH: ${{ steps.macos_signing.outputs.state_path }}
        shell: bash
        run: |
          set -euo pipefail
          script="${{ steps.inputs.outputs.slaveagent_repo }}/.github/scripts/macos-signing-keychain.sh"
          if [ -f "$script" ]; then
            bash "$script" cleanup
          fi

      - name: Upload lane manifest
        if: steps.inputs.outputs.resource_mode == 'source'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.inputs.outputs.lane_artifact }}
          path: ${{ steps.inputs.outputs.lane_manifest }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload Slave Agent DMG artifact
        if: always() && (steps.inputs.outputs.products == 'slave agent' || steps.inputs.outputs.products == 'all')
        uses: actions/upload-artifact@v7
        with:
          name: SlaveAgent_v${{ steps.version.outputs.value }}_${{ steps.inputs.outputs.arch }}
          path: |
            ${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent/releases/${{ steps.version.outputs.value }}/SlaveAgent_*.dmg
            !${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent/releases/${{ steps.version.outputs.value }}/SlaveAgent_neo_*.dmg
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Upload Slave Agent neo DMG artifact
        if: always() && (steps.inputs.outputs.products == 'browserclaw' || steps.inputs.outputs.products == 'all')
        uses: actions/upload-artifact@v7
        with:
          name: SlaveAgent_neo_v${{ steps.version.outputs.value }}_${{ steps.inputs.outputs.arch }}
          path: ${{ steps.inputs.outputs.slaveagent_repo }}/packages/slave agent/releases/${{ steps.version.outputs.value }}/SlaveAgent_neo_*.dmg
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Slack failure ping
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({"text": f":x: macOS release failed — {os.environ['RUN_URL']}"}))
          PY
          )"
          curl -fsS -X POST -H "Content-type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL" || true
