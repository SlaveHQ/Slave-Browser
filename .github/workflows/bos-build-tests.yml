name: Build System Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/slave agent/bos_build/**"
      - "packages/slave agent/tools/vendor_uploads/**"
      - "packages/slave agent/slavebrowser_files/products/**"
      - "packages/slave agent/pyproject.toml"
      - "packages/slave agent/uv.lock"
      - "tools/release_secrets/**"
      - ".github/scripts/macos-slave browser-workspace.sh"
      - ".github/scripts/macos-signing-keychain.sh"
      - ".github/workflows/bos-build-tests.yml"
      - ".github/workflows/build-slave agent.yml"
      - ".github/workflows/nightly-macos-slave agent.yml"
      - ".github/workflows/nightly-macos-browserclaw.yml"
      - ".github/workflows/reusable-build-macos-nightly.yml"
      - ".github/workflows/publish-server-ota.yml"
      - ".github/workflows/repair-update-feed.yml"
      - ".github/workflows/release-app-onboard.yml"
      - ".github/workflows/release-slave agent.yml"
      - ".github/workflows/release-browserclaw.yml"
      - ".github/workflows/release-claw-onboard.yml"
      - ".github/workflows/release-claw-server.yml"
      - ".github/workflows/release-extension-feeds.yml"
      - ".github/workflows/release-extensions.yml"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-macos.yml"
      - ".github/workflows/release-server.yml"
      - ".github/workflows/release-windows.yml"

jobs:
  tests:
    name: bos_build / unittest + ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/slave agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Run bos_build tests
        run: uv run python -m unittest discover -s bos_build -t . -p "*_test.py" -v

      - name: Run release secrets tests
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s tools/release_secrets -t . -p "*_test.py" -v

      - name: Ruff
        run: uv run ruff check bos_build

      - name: CLI smoke
        run: |
          uv run slave agent build --list > /dev/null
          # Runner has no slave browser checkout — this smoke IS the
          # no-checkout regression test for --show-plan.
          uv run slave agent build --preset release --show-plan
          uv run slave agent product doctor

      - name: Run vendor_uploads tests
        working-directory: packages/slave agent/tools/vendor_uploads
        run: uv run python -m unittest discover -s vendor_uploads -t . -p "*_test.py"

  windows-git-bootstrap:
    name: Windows Git bootstrap / Git Bash + native Git
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Verify Windows Git bootstrap
        shell: bash
        working-directory: packages/slave agent
        run: uv run python -m unittest bos_build.ci_workflow_test -v
